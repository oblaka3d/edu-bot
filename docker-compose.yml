version: '3.8'

services:
  edu-bot:
    build: .
    container_name: edu-bot
    restart: unless-stopped
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - TZ=Europe/Moscow
    volumes:
      - ./data:/app/data
      - ./roadmaps:/app/roadmaps:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
